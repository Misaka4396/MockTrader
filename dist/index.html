* {

body {
  display: flex;

}
header h1 {
  font-size: 17px;
  margin: 0;
  font-weight: 600;
  letter-spacing: 0.5px;
}
header h1 .accent {
  color: var(--accent);
  text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
}
header .sub {
  color: var(--dim);
  font-size: 12px;
}
.layout {
  flex: 1;
  display: flex;
  min-height: 0;
}
.sidebar {
  width: 330px;
  min-width: 330px;
  overflow-y: auto;
  padding: 14px;
  border-right: 1px solid var(--line);
  background: var(--panel);
}
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 14px;
  gap: 12px;
  overflow-y: auto;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
}
.card h3 {
  margin: 0 0 10px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--dim);
}
.row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
}
.row label {
  width: 96px;
  color: var(--dim);
  flex: 0 0 auto;
}
select,
input[type='number'],
input[type='text'] {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  width: 100%;
}
input[type='checkbox'] {
  accent-color: var(--accent);
}
.sector-group {
  margin-bottom: 8px;
}
.sector-group .sector-title {
  color: var(--accent);
  font-weight: 600;
  margin: 4px 0;
  cursor: pointer;
}
.variety-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px 8px;
}
.variety-grid label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
}
.variety-grid input {
  margin: 0;
}
.btn {
  background: var(--accent);
  color: #041018;
  border: 0;
  border-radius: 8px;
  padding: 10px 18px;
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
  letter-spacing: 1px;
}
.btn:hover {
  box-shadow: 0 0 16px rgba(0, 240, 255, 0.6);
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn.ghost {
  background: transparent;
  color: var(--accent);
  border: 1px solid var(--accent);
}
.btn.ghost.active {
  background: var(--accent);
  color: #041018;
}
.progress {
  height: 10px;
  background: var(--panel2);
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--line);
}
.progress .bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--accent), #7deaff);
  transition: width 0.2s;
}
.progress-label {
  font-size: 11px;
  color: var(--dim);
  margin-top: 4px;
}
.conclusion {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: linear-gradient(135deg, #0f1a30, #13223c);
}
.conclusion .verdict {
  font-size: 26px;
  font-weight: 800;
}
.conclusion .verdict.beat {
  color: var(--good);
  text-shadow: 0 0 14px rgba(46, 230, 166, 0.5);
}
.conclusion .verdict.lose {
  color: var(--bad);
  text-shadow: 0 0 14px rgba(255, 107, 138, 0.5);
}
.conclusion .verdict.close {
  color: var(--warn);
  text-shadow: 0 0 14px rgba(255, 176, 32, 0.5);
}
.kpis {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}
.kpi {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
}
.kpi .v {
  font-size: 18px;
  font-weight: 700;
}
.kpi .v.pos {
  color: var(--good);
}
.kpi .v.neg {
  color: var(--bad);
}
.kpi .k {
  font-size: 11px;
  color: var(--dim);
  margin-top: 3px;
}
.chart-wrap {
  position: relative;
}
.chart-toolbar {
  display: flex;
  gap: 6px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
canvas#chart {
  width: 100%;
  height: 340px;
  background: #0a1122;
  border-radius: 8px;
  border: 1px solid var(--line);
  display: block;
  cursor: crosshair;
}
.note {
  font-size: 11px;
  color: var(--dim);
  line-height: 1.5;
}
.muted {
  color: var(--dim);
}
.error {
  color: var(--bad);
  background: rgba(255, 107, 138, 0.1);
  border: 1px solid var(--bad);
  border-radius: 8px;
  padding: 10px;
}

            <label>多头数量</label><input type="number" id="longCount" value="5" min="1" max="20" />

          <div class="row">
            <label>空头数量</label
            ><input type="number" id="shortCount" value="5" min="1" max="20" />
          </div>
          <div class="row">
            <label>权重方案</label>
            <select id="weighting">
              <option value="equal">等权</option>
              <option value="score">得分加权</option>
            </select>
          </div>
          <div class="row">
            <label>合成方式</label>
            <select id="combine">
              <option value="equal">等权</option>
              <option value="ic">IC 加权</option>
            </select>
          </div>
          <div class="row">
            <label>调仓频率</label>
            <select id="rebalance">
              <option value="monthly">月度</option>
              <option value="weekly">周度</option>
            </select>
          </div>
          <div class="row">
            <label>总敞口</label
            ><input type="number" id="grossExposure" value="1.0" step="0.1" min="0.1" />
          </div>
        </div>

        <div class="card">
          <h3>回测与基准</h3>
          <div class="row">
            <label>初始资金</label
            ><input type="number" id="initialCapital" value="10000000" step="1000000" />
          </div>
          <div class="row">
            <label>手续费率</label
            ><input type="number" id="commissionRate" value="0.0002" step="0.0001" />
          </div>
          <div class="row">
            <label>滑点(跳)</label><input type="number" id="slippageTicks" value="1" step="1" />
          </div>
          <div class="row">
            <label>纳指长线年化</label
            ><input type="number" id="benchmark" value="0.15" step="0.01" />
          </div>
          <p class="note">
            基准为<b>可配置常数</b>（默认 15%，约 10 年口径），非纳指逐日曲线。CTA
            绝对收益与纳指低相关，此基准用于「是否值得主动交易」的决策参照，非同风险基准。
          </p>
        </div>
      </aside>

      <main class="main">
        <div class="card">
          <div class="row" style="justify-content: space-between">
            <button class="btn" id="runBtn">▶ 运行回测</button>
            <span class="muted">后台线程异步运行，不阻塞界面</span>
          </div>
          <div class="progress"><div class="bar" id="progressBar"></div></div>
          <div class="progress-label" id="progressLabel">就绪</div>
          <div class="error" id="errorBox" style="display: none"></div>
        </div>

        <div class="conclusion" id="conclusion">
          <div style="flex: 0 0 auto">
            <div class="verdict close" id="verdict">—</div>
          </div>
          <div style="flex: 1">

              <label style="width: 90px">策略年化</label><b id="cmpStrategy">—</b>
            </div>
            <div class="row" style="margin: 2px 0">
              <label style="width: 90px">基准年化</label><b id="cmpBenchmark">—</b>
            </div>
            <div class="row" style="margin: 2px 0">
              <label style="width: 90px">超额收益</label><b id="cmpExcess">—</b>
            </div>
          </div>
          <div class="note" style="max-width: 340px" id="benchNote"></div>
        </div>

        <div class="kpis">
          <div class="kpi">
            <div class="v" id="kpiReturn">—</div>
            <div class="k">年化收益率</div>
          </div>
          <div class="kpi">
            <div class="v" id="kpiSharpe">—</div>
            <div class="k">Sharpe</div>
          </div>
          <div class="kpi">
            <div class="v" id="kpiVol">—</div>
            <div class="k">波动率</div>
          </div>
          <div class="kpi">
            <div class="v" id="kpiMaxDD">—</div>
            <div class="k">最大回撤</div>
          </div>
          <div class="kpi">
            <div class="v" id="kpiCalmar">—</div>
            <div class="k">卡玛比率</div>
          </div>
          <div class="kpi">
            <div class="v" id="kpiWin">—</div>
            <div class="k">胜率</div>
          </div>
        </div>

        <div class="card chart-wrap">
          <div class="chart-toolbar">
            <button class="btn ghost active range-btn" data-range="all">全部</button>
            <button class="btn ghost range-btn" data-range="3y">近3年</button>
            <button class="btn ghost range-btn" data-range="1y">近1年</button>
            <label style="margin-left: 12px"

            <label><input type="checkbox" id="ddToggle" /> 回撤阴影</label>

          </div>
          <canvas id="chart"></canvas>
        </div>

        <div class="card note" id="summary">—</div>
      </main>
    </div>

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------

/** FNV-1a 32-bit 字符串哈希 -> 稳定的随机种子 */
function stringSeed(str) {

  for (let i = 0; i < str.length; i++) {

    h = Math.imul(h, 0x01000193);

/** mulberry32 PRNG：返回函数 rand() -> [0,1) */
function mulberry32(seed) {

    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

e / initialCapital : null));\n\n    const rets = [];\n    for (let i = 1; i < nav.length; i++) {\n      if (nav[i] != null && nav[i - 1] != null && nav[i - 1] > 0) {\n        rets.push(nav[i] / nav[i - 1] - 1);\n      }\n    }\n    const n = rets.length;\n    const first = nav.find((x) => x != null);\n    const last = nav[nav.length - 1] != null ? nav[nav.length - 1] : first;\n    const totalReturn = first > 0 ? last / first - 1 : 0;\n\n    const annualizedReturn =\n      n > 0 && first > 0 ? Math.pow(last / first, cfg.tradingDaysPerYear / n) - 1 : 0;\n    const volatility = n > 0 ? std(rets) * Math.sqrt(cfg.tradingDaysPerYear) : 0;\n    const sharpe = volatility > 0 ? (annualizedReturn - cfg.riskFreeRate) / volatility : 0;\n\n    // 最大回撤\n    let peak = -Infinity;\n    let maxDD = 0;\n    for (const v of nav) {\n      if (v == null) {\n        continue;\n      }\n      if (v > peak) {\n        peak = v;\n      }\n      const dd = peak > 0 ? (peak - v) / peak : 0;\n      if (dd > maxDD) {\n        maxDD = dd;\n      }\n    }\n    const calmar = maxDD > 0 ? annualizedReturn / maxDD : 0;\n    const winRate = n > 0 ? rets.filter((r) => r > 0).length / n : 0;\n\n    // 基准（常数 + 复利参考线）\n    const annual = cfg.benchmarkAnnual != null ? cfg.benchmarkAnnual : 0.15;\n    const benchmarkNav = nav.map((_, i) => Math.pow(1 + annual, i / cfg.tradingDaysPerYear));\n    const benchmarkFinal = benchmarkNav[nav.length - 1];\n\n    const excess = annualizedReturn - annual;\n    const verdict =\n      excess > cfg.verdictThreshold ? '跑赢' : excess < -cfg.verdictThreshold ? '跑输' : '接近';\n\n    return {\n      dates,\n      nav,\n      benchmarkNav,\n      metrics: {\n        totalReturn,\n        annualizedReturn,\n        volatility,\n        sharpe,\n        maxDrawdown: maxDD,\n        calmar,\n        winRate,\n        nDays: n,\n      },\n      benchmark: {\n        annual,\n        name: cfg.benchmarkName,\n        note: cfg.benchmarkNote,\n        finalValue: benchmarkFinal,\n   let chart = null;
  let worker = null;

  function $(id) {
    return document.getElementById(id);
  }
  function pct(x, dp) {
    return `${(x * 100).toFixed(dp == null ? 2 : dp)}%`;
  }
  function num(x, dp) {
    return Number(x).toLocaleString('zh-CN', {
      minimumFractionDigits: dp == null ? 2 : dp,
      maximumFractionDigits: dp == null ? 2 : dp,
    });
  }

  // ---- 品种多选（按板块分组） ----
  function buildVarietyPicker() {
    const container = $('varietyPicker');
    container.innerHTML = '';
    MT.SECTORS.forEach(function (sector) {
      const metas = MT.BY_SECTOR[sector] || [];
      if (!metas.length) {
        return;
      }
      const group = document.createElement('div');
      group.className = 'sector-group';
      const title = document.createElement('div');
      title.className = 'sector-title';
      title.textContent = `${sector} (${metas.length})`;
      title.onclick = function () {
        toggleSector(sector);
      };
      group.appendChild(title);
      const grid = document.createElement('div');
      grid.className = 'variety-grid';
      metas.forEach(function (m) {
        const lab = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = m.code;
        cb.checked = true;
        cb.className = 'variety-cb';
        cb.dataset.sector = sector;
        if (m.delist) {
          cb.title = `已退市 ${m.delist}`;
        }
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(`${m.code} ${m.name}`));
        grid.appendChild(lab);
      });
      group.appendChild(grid);
      container.appendChild(group);
    });
  }

  function toggleSector(sector) {
    const cbs = document.querySelectorAll(`.variety-cb[data-sector="${sector}"]`);
    let allOn = true;
    cbs.forEach(function (cb) {
      if (!cb.checked) {
        allOn = false;
      }
    });
    cbs.forEach(function (cb) {
      cb.checked = !allOn;
    });
  }

  function selectedVarieties() {
    const cbs = Array.prototype.slice.call(document.querySelectorAll('.variety-cb'));
    const checked = cbs
      .filter(function (cb) {
        return cb.checked;
      })
      .map(function (cb) {
        return cb.value;
      });
    const total = cbs.length;
    if (checked.length === total) {
      return null;
    } // 全选 -> 全品种池
    return checked;
  }

  // ---- 收集配置 ----
  function gatherConfig() {
    const mode = $('strategy').value;
    const factors = mode === 'all' ? MT.FACTOR_KEYS.slice() : [mode];
    const rebalance = $('rebalance').value;
    return {
      varieties: selectedVarieties(),
      factorParams: {},
      strategyConfig: {
        factors: factors,
        longCount: Number($('longCount').value) || 5,
        shortCount: Number($('shortCount').value) || 5,
        weighting: $('weighting').value,
        combine: $('combine').value,
        rebalance: rebalance,
        rebalanceDays: rebalance === 'weekly' ? 5 : 21,
        grossExposure: Number($('grossExposure').value) || 1.0,
        neutral: true,
        mode: 'longShort',
      },
      backtestConfig: {
        initialCapital: Number($('initialCapital').value) || 10000000,
        commissionRate: Number($('commissionRate').value) || 0.0002,
        slippageTicks: Number($('slippageTicks').value) || 1,
        executionDelay: 1,
        maxLeverage: 1.5,
      },
      perfConfig: {
        benchmarkAnnual: Number($('benchmark').value) || 0.15,
      },
    };
  }

  // ---- 运行 ----
  function run() {
    const btn = $('runBtn');
    btn.disabled = true;
    $('errorBox').style.display = 'none';
    setProgress(0, '准备中…');
    const config = gatherConfig();
    if (worker) {
      worker.terminate();
    }
    worker = new Worker(
      URL.createObjectURL(new Blob([WORKER_SOURCE], { type: 'text/javascript' }))
    );
    worker.onmessage = function (e) {
      const msg = e.data;
      if (msg.type === 'progress') {
        setProgress(msg.frac, msg.step);
      } else if (msg.type === 'result') {
        setProgress(1, '完成');
        btn.disabled = false;
        render(msg.result);
      } else if (msg.type === 'error') {
        btn.disabled = false;
        showError(msg.message);
      }
    };
    worker.onerror = function (e) {
      btn.disabled = false;
      showError(e.message || 'Worker error');
    };
    worker.postMessage({ config: config });
  }

  function setProgress(frac, step) {
    $('progressBar').style.width = `${(frac * 100).toFixed(1)}%`;
    $('progressLabel').textContent = `${step} (${(frac * 100).toFixed(0)}%)`;
  }

  function showError(msg) {
    const box = $('errorBox');
    box.style.display = 'block';
    box.textContent = `运行失败：${msg}`;
  }

  // ---- 渲染结果 ----
  function render(result) {
    const perf = result.performance;
    const cmp = perf.comparison;
    const met = perf.metrics;
    const bench = perf.benchmark;

    // 结论卡片
    const verdictEl = $('verdict');
    verdictEl.textContent = cmp.verdict;
    verdictEl.className = `verdict ${cmp.verdict === '跑赢' ? 'beat' : cmp.verdict === '跑输' ? 'lose' : 'close'}`;
    $('cmpStrategy').textContent = pct(cmp.strategyAnnual);
    $('cmpBenchmark').textContent = pct(cmp.benchmarkAnnual);
    $('cmpExcess').textContent = (cmp.excess >= 0 ? '+' : '') + pct(cmp.excess);
    $('cmpExcess').style.color = cmp.excess >= 0 ? 'var(--good)' : 'var(--bad)';
    $('benchNote').textContent = bench.note || '';

    // KPI
    setKpi('kpiReturn', met.annualizedReturn, true);
    setKpi('kpiSharpe', met.sharpe, false);
    setKpi('kpiVol', met.volatility, false);
    setKpi('kpiMaxDD', -met.maxDrawdown, false);
    setKpi('kpiCalmar', met.calmar, false);
    setKpi('kpiWin', met.winRate, false, true);

    // 摘要
    $('summary').textContent = `品种 ${result.summary.nVarieties} · 交易日 ${
      result.summary.nDates
    } · 调仓 ${result.summary.nRebalances} 次 · 交易 ${result.summary.nTrades} 笔 · 展期 ${
      result.summary.nRolls
    } 次 · 总成本 ${num(result.summary.totalCost, 0)} · 期末权益 ${num(
      result.summary.finalEquity,
      0
    )}`;

    // 图表
    chart.setData(perf.dates, [
      { name: '策略净值', values: perf.nav, color: '#00f0ff', width: 1.6, dashed: false },
      {
        name: `基准复利 ${pct(bench.annual)}`,
        values: perf.benchmarkNav,
        color: '#ffb020',
        width: 1.2,
        dashed: true,
      },
    ]);
    $('benchToggle').checked = true;
    $('ddToggle').checked = false;
    chart.setVisible('策略净值', true);
  }

  function setKpi(id, value, isPct, isWin) {
    const el = $(id);
    if (isWin) {
      el.textContent = pct(value);
      el.className = 'v';
      return;
    }
    el.textContent = isPct ? pct(value) : Number(value).toFixed(2);
    el.className = `v ${value > 0 ? 'pos' : value < 0 ? 'neg' : ''}`;
  }

  // ---- 初始化 ----
  function init() {
    buildVarietyPicker();
    chart = new LineChart($('chart'));

    $('runBtn').onclick = run;
    $('selectAll').onclick = function () {
      document.querySelectorAll('.variety-cb').forEach(function (cb) {
        cb.checked = true;
      });
    };
    $('selectNone').onclick = function () {
      document.querySelectorAll('.variety-cb').forEach(function (cb) {
        cb.checked = false;
      });
    };

    document.querySelectorAll('.range-btn').forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll('.range-btn').forEach(function (x) {
          x.classList.remove('active');
        });
        b.classList.add('active');
        chart.setRange(b.dataset.range);
      };
    });
    $('benchToggle').onchange = function (e) {
      chart.setVisible(
        chart.series.find(function (s) {
          return s.name.indexOf('基准') === 0;
        }).name,
        e.target.checked
      );
    };
    $('ddToggle').onchange = function (e) {
      chart.setDrawdown(e.target.checked);
    };

    // 默认给一条占位说明
    chart.setData([], []);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
;
    </script>
  </body>
