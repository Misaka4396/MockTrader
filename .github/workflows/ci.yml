name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint / Format / Test / Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Commit message check (commitlint)
        if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Unit tests (21 acceptance)
        run: npm test

      - name: Build web bundle
        run: npm run build:web

      - name: Smoke verification (bundle == source + worker + HTML)
        run: npm run smoke

      - name: E2E smoke (Web prototype in headless Chromium)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium
