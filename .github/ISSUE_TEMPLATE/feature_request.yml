name: Feature request
description: 提出新功能或改进建议
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请说明背景与价值，越具体越容易评估。
  - type: textarea
    id: problem
    attributes:
      label: 背景 / 要解决的问题
      description: 这个功能解决什么场景下的什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望如何实现？可含接口/参数设想
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 其他考虑过的方案（可选）
  - type: dropdown
    id: area
    attributes:
      label: 影响模块
      options:
        - 数据层 S1
        - 因子引擎 S2
        - 策略引擎 S3
        - 回测引擎 S4
        - 绩效引擎 S5
        - Web 界面 S6/S7
        - C# 版 S8
        - 构建/工具链
    validations:
      required: true
